name: CI

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - '**/*.cmake'
      - cmake/**
      - .gitmodules
      - .github/workflows/**
      - src/**
      - include/**
      - tools/**
      - test/**
      - examples/**
      - scripts/**
      - upstream
      - upstream/**
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - '**/*.cmake'
      - cmake/**
      - .gitmodules
      - .github/workflows/**
      - src/**
      - include/**
      - tools/**
      - test/**
      - examples/**
      - scripts/**
      - upstream
      - upstream/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run examples
        run: |
          set -euo pipefail
          for example in basics threads include main; do
            ./build/gscvm "examples/${example}.gsc"
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gscvm-linux-x86_64
          path: |
            build/gscvm
            build/gsc-tool
            build/gscvm-tests
            LICENSE
            NOTICE.md
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGSCVM_BUILD_UPSTREAM_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run examples
        shell: pwsh
        run: |
          $examples = @("basics", "threads", "include", "main")
          foreach ($example in $examples) {
            & "build\Release\gscvm.exe" "examples\$example.gsc"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gscvm-windows-x86_64
          path: |
            build/Release/gscvm.exe
            build/Release/gsc-tool.exe
            build/Release/gscvm-tests.exe
            LICENSE
            NOTICE.md
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B build-wasm -DGSCVM_BUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm --parallel 2

      - name: Smoke test
        run: |
          node - <<'JS'
          const createGscvmModule = require('./build-wasm/gscvm.js');
          createGscvmModule().then((Module) => {
            const ok = Module._gscvm_init();
            if (ok !== 1) throw new Error(`gscvm_init returned ${ok}`);
            Module._gscvm_shutdown();
            console.log('wasm smoke test passed');
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

      - name: Upload WebAssembly
        uses: actions/upload-artifact@v4
        with:
          name: gscvm-wasm
          path: |
            build-wasm/gscvm.js
            build-wasm/gscvm.wasm
          if-no-files-found: error
          retention-days: 14
