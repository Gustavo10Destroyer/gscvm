name: CI

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - '**/*.cmake'
      - cmake/**
      - .gitmodules
      - .github/workflows/**
      - src/**
      - include/**
      - tools/**
      - test/**
      - examples/**
      - scripts/**
      - upstream
      - upstream/**
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - '**/*.cmake'
      - cmake/**
      - .gitmodules
      - .github/workflows/**
      - src/**
      - include/**
      - tools/**
      - test/**
      - examples/**
      - scripts/**
      - upstream
      - upstream/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run examples
        run: |
          set -euo pipefail
          for example in basics threads include main; do
            ./build/gscvm "examples/${example}.gsc"
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gscvm-linux-x86_64
          path: |
            build/gscvm
            build/gsc-tool
            build/gscvm-tests
            LICENSE
            NOTICE.md
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGSCVM_BUILD_UPSTREAM_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run examples
        shell: pwsh
        run: |
          $examples = @("basics", "threads", "include", "main")
          foreach ($example in $examples) {
            & "build\Release\gscvm.exe" "examples\$example.gsc"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-windows
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gscvm-windows-x86_64
          path: |
            build/Release/gscvm.exe
            build/Release/gsc-tool.exe
            build/Release/gscvm-tests.exe
            LICENSE
            NOTICE.md
          if-no-files-found: error
          retention-days: 14
